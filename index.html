<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>从工位到顶楼</title>
<style>
:root {
    --carpet: #E3E7EB;
    --paper: #FDFDFB;
    --ink: #1B2430;
    --ink-soft: #5A6675;
    --line: #C7CFD8;
    --lanyard: #1F5FD1;
    --seal: #D32B26;
    --marker: #FFE94A;
    --sans: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;
    --song: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
    --fang: "STFangsong", "FangSong", "FangSong_GB2312", "Songti SC", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
    background: var(--carpet);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--lanyard); outline-offset: 2px; }

.app {
    position: relative;
    max-width: 420px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 0 16px 40px;
}
[hidden] { display: none !important; }

/* 工牌：挂绳从屏幕顶端垂下来，整局游戏都挂在上面 */
.lanyard {
    width: 26px;
    height: 44px;
    margin: 0 auto;
    background: var(--lanyard);
}
.badge {
    position: relative;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 30px 20px 20px;
}
.badge::before {
    content: "";
    position: absolute;
    top: 10px;
    left: 50%;
    width: 46px;
    height: 9px;
    margin-left: -23px;
    border-radius: 5px;
    background: var(--carpet);
    border: 1px solid var(--line);
}

/* 开始页 */
.title {
    margin: 4px 0 2px;
    font-size: 34px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: 0.04em;
}
.subtitle { margin: 0 0 22px; color: var(--ink-soft); }
.field-label { display: block; margin: 0 0 6px; font-size: 14px; color: var(--ink-soft); }
.name-input {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    background: #fff;
}
.origins { display: grid; gap: 8px; margin: 16px 0 20px; padding: 0; border: 0; }
.origins legend { padding: 0; margin: 0 0 6px; font-size: 14px; color: var(--ink-soft); }
.origin {
    display: block;
    width: 100%;
    padding: 10px 12px;
    text-align: left;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 6px;
}
.origin[aria-pressed="true"] { border-color: var(--lanyard); box-shadow: inset 4px 0 0 var(--lanyard); }
.origin b { display: block; font-size: 17px; }
.origin span { font-size: 14px; color: var(--ink-soft); }
.primary {
    width: 100%;
    padding: 13px 16px;
    border: 0;
    border-radius: 6px;
    background: var(--lanyard);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
}
.secondary {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    background: transparent;
    font-size: 16px;
}
.archive { margin-top: 26px; }
.archive h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
.archive ul { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.archive li {
    padding: 2px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 14px;
    color: var(--ink-soft);
}
.archive li.seen { border-color: var(--seal); color: var(--seal); background: var(--paper); }

/* 游戏页 */
.badge.compact { padding: 26px 16px 14px; }
.who { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0 12px; }
.rank { font-size: 26px; font-weight: 700; line-height: 1.2; }
.rank span { white-space: nowrap; }
.age { font-size: 15px; color: var(--ink-soft); white-space: nowrap; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin: 12px 0 0; }
.meter { font-size: 13px; }
.meter-head { display: flex; justify-content: space-between; }
.meter-head b { font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { height: 6px; margin-top: 2px; background: var(--carpet); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); transition: width 0.35s ease; }
.meter.low .bar i { background: var(--seal); }
.meter.low b { color: var(--seal); }

.notice {
    margin: 14px 0 0;
    padding: 10px 14px;
    border-left: 4px solid var(--seal);
    background: var(--paper);
    font-size: 15px;
}
.notice b { color: var(--seal); }

.memo {
    margin: 14px 0 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
}
.memo-from {
    padding: 8px 16px;
    border-bottom: 1px dashed var(--line);
    font-size: 13px;
    color: var(--ink-soft);
}
.memo-body { padding: 14px 16px 4px; font-size: 17px; }
.memo-body p { margin: 0 0 10px; }
.recall { color: var(--ink-soft); font-size: 15px; }
.choices { display: grid; gap: 8px; padding: 6px 16px 16px; }
.choice {
    display: grid;
    grid-template-columns: 30px 1fr;
    align-items: stretch;
    padding: 0;
    text-align: left;
    background: #fff;
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    overflow: hidden;
}
.choice em {
    display: grid;
    place-items: center;
    background: var(--ink);
    color: #fff;
    font-style: normal;
    font-weight: 600;
}
.choice span { padding: 10px 12px; }
.choice:active { background: var(--marker); }
.picked { margin: 0 0 8px; font-size: 14px; color: var(--ink-soft); }
.deltas { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.delta {
    padding: 0 8px;
    background: var(--marker);
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}
.delta.down { background: transparent; box-shadow: inset 0 0 0 1.5px var(--seal); color: var(--seal); }
.next { padding: 0 16px 16px; }

/* 结局页：红头文件 */
.doc {
    position: relative;
    margin-top: 20px;
    padding: 26px 22px 30px;
    background: var(--paper);
    border: 1px solid var(--line);
    font-family: var(--fang);
    font-size: 17px;
    line-height: 1.75;
}
.doc-org {
    margin: 0;
    color: var(--seal);
    font-family: var(--song);
    font-size: 24px;
    font-weight: 700;
    line-height: 1.3;
    text-align: center;
    letter-spacing: 0.03em;
    white-space: nowrap;
}
.doc .doc-no { margin: 10px 0 8px; text-align: center; font-size: 15px; }
.doc-rule { height: 0; margin: 0 0 18px; border: 0; border-top: 2.5px solid var(--seal); }
.doc-subject {
    margin: 0 0 14px;
    font-family: var(--song);
    font-size: 19px;
    font-weight: 700;
    line-height: 1.45;
    text-align: center;
}
.doc p { margin: 0 0 6px; text-indent: 2em; }
.doc .doc-org, .doc .doc-no, .doc .doc-foot { text-indent: 0; }
.doc ol { margin: 0 0 6px; padding: 0 0 0 2em; list-style: none; }
.verdict-title {
    margin: 14px 0 4px;
    font-family: var(--song);
    font-size: 46px;
    font-weight: 700;
    line-height: 1.2;
    text-align: center;
    letter-spacing: 0.1em;
}
.doc .verdict-line { margin: 0 0 16px; text-indent: 0; text-align: center; }
.sheet {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    margin: 0 0 18px;
    border-top: 1px solid var(--ink);
    border-left: 1px solid var(--ink);
    font-family: var(--sans);
}
.sheet div { padding: 5px 4px; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); text-align: center; }
.sheet dt, .sheet .k { display: block; font-size: 12px; color: var(--ink-soft); }
.sheet .v { display: block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sign { position: relative; min-height: 112px; padding-top: 22px; text-align: right; }
.sign p { margin: 0; text-indent: 0; }
.seal {
    position: absolute;
    right: 6px;
    top: -18px;
    width: 128px;
    height: 128px;
    transform: rotate(-9deg);
    mix-blend-mode: multiply;
    opacity: 0.88;
    animation: stamp 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.5s both;
}
@keyframes stamp {
    from { opacity: 0; transform: rotate(-9deg) scale(2.3); }
    to { opacity: 0.88; transform: rotate(-9deg) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
    .seal { animation: none; }
    .bar i { transition: none; }
}
.doc .doc-foot { margin: 14px 0 0; font-family: var(--sans); font-size: 12px; color: var(--ink-soft); text-align: center; }
.end-actions { display: grid; gap: 8px; margin-top: 16px; }
.hint { margin: 10px 0 0; font-size: 13px; color: var(--ink-soft); text-align: center; }
</style>
</head>
<body>
<main class="app">
    <section id="screen-start">
        <div class="lanyard"></div>
        <div class="badge">
            <h1 class="title">从工位到顶楼</h1>
            <p class="subtitle">22 岁入职，一年一个选择，看你这辈子能爬到哪一层。</p>
            <label class="field-label" for="name">工牌上写谁的名字</label>
            <input class="name-input" id="name" maxlength="8" placeholder="不填就叫「打工人」" autocomplete="off">
            <fieldset class="origins" id="origins"><legend>你是怎么进来的</legend></fieldset>
            <button class="primary" id="btn-start">办理入职</button>
        </div>
        <div class="archive">
            <h2 id="archive-head"></h2>
            <ul id="archive-list"></ul>
        </div>
    </section>

    <section id="screen-play" hidden>
        <div class="lanyard"></div>
        <div class="badge compact">
            <div class="who">
                <div class="rank" id="hud-rank"></div>
                <div class="age" id="hud-age"></div>
            </div>
            <div class="meters" id="hud-meters"></div>
        </div>
        <div id="notices"></div>
        <div class="memo" id="memo"></div>
    </section>

    <section id="screen-end" hidden>
        <article class="doc" id="doc"></article>
        <p class="hint">截图这张文件，发到群里</p>
        <div class="end-actions">
            <button class="primary" id="btn-again">重新入职</button>
            <button class="secondary" id="btn-copy">复制战报文字</button>
        </div>
    </section>
</main>

<script id="engine">
/*
 * 这一段是游戏内容和规则，不碰页面。想加事件，只改 EVENTS 数组就行。
 *
 * 一个事件：
 *   id      唯一名字
 *   tier    什么阶段会遇到：junior(实习生/专员) mid(主管/经理) senior(总监/副总裁)
 *           boss(老板) any(都会)
 *   from    消息是谁发来的
 *   text    事件正文
 *   mirror  (可选) 记下玩家这次怎么选，等当了高管遇到 recall 相同的事件时提醒 ta
 *   recall  (可选) 对应上面的 mirror
 *   choices 2~3 个选项，每个：
 *       label   选项文字
 *       text    选完的结果
 *       fx      数值变化：perf 业绩 / net 人脉 / hp 健康 / heart 良心 / money 存款(万)
 *       risk    (可选) { chance: 概率, text, fx, ending } 小概率换成另一个结果
 *       check   (可选) { stat, min, fail: { text, fx, ending } } 数值不够就走 fail
 *       ending  (可选) 直接进入某个结局
 */
const Game = (() => {
    const RANKS = ['实习生', '专员', '主管', '经理', '总监', '副总裁', '老板'];
    const SAVINGS = [1, 2, 5, 9, 18, 35, 80];
    const PROMOTE = [
        { perf: 18, net: 0 },
        { perf: 30, net: 14 },
        { perf: 42, net: 24 },
        { perf: 54, net: 34 },
        { perf: 70, net: 48 },
        { perf: 86, net: 60 },
    ];
    const MIN_YEARS_AT_RANK = 2;
    const START_AGE = 22;
    const LAST_AGE = 45;
    const BOSS_YEARS = 3;
    const SECRETARY_RANK = 4;
    const STAT_NAMES = { perf: '业绩', net: '人脉', hp: '健康', heart: '良心', money: '存款' };

    const ORIGINS = [
        {
            id: 'elite', name: '名校应届生', desc: '业绩起点高，谁也不认识',
            stats: { perf: 16, net: 6, hp: 80, heart: 70 },
        },
        {
            id: 'plain', name: '普通毕业生', desc: '什么都普通，但是能熬',
            stats: { perf: 9, net: 12, hp: 92, heart: 78 },
        },
        {
            id: 'nepo', name: '老板的远房亲戚', desc: '人脉开局就有，活不太会干',
            stats: { perf: 4, net: 30, hp: 82, heart: 60 },
        },
    ];

    const ENDINGS = {
        icu: { title: '福报战神', line: '你把一切都给了公司，包括住院押金。', seal: '因病离岗' },
        exposed: { title: '东窗事发', line: '你走过的每一条捷径，都有人留了截图。', seal: '予以辞退' },
        scapegoat: { title: '专业背锅', line: '事故报告上只有你一个人的名字。', seal: '予以辞退' },
        laid35: { title: '光荣毕业', line: '公司说这不叫裁员，叫向社会输送人才。', seal: '准予毕业' },
        dali: { title: '逃离工位', line: '民宿第二年就亏完了，但你再没失眠过。', seal: '准予离职' },
        boss_good: { title: '良心老板', line: '小周说，你是 ta 见过最不像老板的老板。', seal: '准予登顶' },
        boss_mid: { title: '人生巅峰', line: '你站在顶楼往下看，认不出哪个工位曾经是你的。', seal: '准予登顶' },
        boss_bad: { title: '活成了他', line: '你终于成了老板，也终于成了当年那个老板。', seal: '准予登顶' },
        retire_exec: { title: '高管离场', line: '差一步到顶楼。电梯到这层就不往上了。', seal: '考核通过' },
        retire_mid: { title: '中层钉子', line: '上面的下不来，下面的上不去，你在中间坐了二十年。', seal: '考核通过' },
        retire_low: { title: '万年专员', line: '你送走了五任老板，工位从没换过。', seal: '考核通过' },
        fish: { title: '摸鱼宗师', line: '工资没涨，头发没掉。很难说谁赢了。', seal: '考核通过' },
    };

    const EVENTS = [
        // ---------- 实习生 / 专员 ----------
        {
            id: 'j_weekend', tier: 'junior', from: '老板', mirror: 'weekend',
            text: '周五晚上 8 点，老板在群里 @你：「这个 PPT 周一早上要，辛苦一下。」',
            choices: [
                {
                    label: '收到，周末加班改',
                    text: '你改到周日凌晨。周一老板翻了两页，说先放着。',
                    fx: { perf: 8, hp: -8 },
                },
                {
                    label: '回复：周末有事，周一上午给',
                    text: '老板没说什么。周一上午你交了，没人发现区别。',
                    fx: { hp: 4, heart: 3, perf: -1 },
                    risk: { chance: 0.3, text: '老板回了个「好的。」带句号。', fx: { hp: 4, net: -6 } },
                },
                {
                    label: '已读不回，周一早到两小时赶出来',
                    text: '赶出来了，错了两个数。没人看到那两页。',
                    fx: { perf: 4, hp: -3 },
                },
            ],
        },
        {
            id: 'j_blame', tier: 'junior', from: '老板', mirror: 'blame',
            text: '项目上线出了事故。老板把你叫进会议室：「这次对外就说是你这边疏忽了，我心里有数。」',
            choices: [
                {
                    label: '认了',
                    text: '老板确实心里有数，季度奖多给了你两千。',
                    fx: { perf: -3, net: 10, heart: -3 },
                    risk: {
                        chance: 0.12,
                        text: '年底裁员需要理由，你的事故记录正好在第一页。',
                        ending: 'scapegoat',
                    },
                },
                {
                    label: '当场拿出聊天记录',
                    text: '事故记到了该记的人头上。老板从此叫你全名。',
                    fx: { perf: 4, net: -8, heart: 5 },
                },
                {
                    label: '私下谈条件：背可以，晋升名额给我',
                    text: '老板看了你很久，说：「你比我想的聪明。」',
                    fx: { perf: 7, net: 3, heart: -8 },
                },
            ],
        },
        {
            id: 'j_credit', tier: 'junior', from: '周会', mirror: 'credit',
            text: '你熬了三周做的方案，同事老吴在周会上讲得眉飞色舞，全程没提你的名字。',
            choices: [
                {
                    label: '当场补一句：这部分数据是我跑的',
                    text: '会议室安静了两秒。老板看了你一眼，记住了你。',
                    fx: { perf: 7, net: -4 },
                },
                {
                    label: '会后群发邮件，附上文件修改记录',
                    text: '功劳回来了。老吴再也没跟你一起吃过午饭。',
                    fx: { perf: 9, net: -8, heart: -2 },
                },
                {
                    label: '算了，下次再说',
                    text: '你失眠了两天。老吴当月评了优秀员工。',
                    fx: { perf: -3, hp: -3, heart: 2 },
                },
            ],
        },
        {
            id: 'j_toast', tier: 'junior', from: '团建饭局',
            text: '团建饭局上，老板举起杯子看向你：「年轻人，表示一下？」',
            choices: [
                {
                    label: '干了',
                    text: '你干了三杯。老板拍着你的肩说好样的，第二天不记得你叫什么。',
                    fx: { net: 6, hp: -8 },
                },
                {
                    label: '以茶代酒',
                    text: '气氛冷了一下，很快有人接过了话。',
                    fx: { hp: 2, heart: 2, net: -3 },
                },
                {
                    label: '不喝，但包揽倒酒、转桌、叫代驾',
                    text: '散场时每个人的代驾都是你叫的。行政说你靠谱。',
                    fx: { net: 7, hp: -3, perf: 1 },
                },
            ],
        },
        {
            id: 'j_script', tier: 'junior', from: '你自己',
            text: '你写了个小脚本，把每天要花两小时的报表活变成了点一下。',
            choices: [
                {
                    label: '告诉老板',
                    text: '老板很高兴，把另外两个人的报表也交给了你。',
                    fx: { perf: 10, hp: -5 },
                },
                {
                    label: '谁也不告诉',
                    text: '你每天多出两小时。你把它们用在了午睡上。',
                    fx: { hp: 9, heart: -1 },
                },
                {
                    label: '分享给全组',
                    text: '全组每天早走一小时。有人给你带了一个月的咖啡。',
                    fx: { net: 10, perf: 3 },
                },
            ],
        },
        {
            id: 'j_offer', tier: 'junior', from: '猎头',
            text: '隔壁公司想挖你，工资多三成，但要常驻外地。',
            choices: [
                {
                    label: '去',
                    text: '钱确实多了。你在出租屋里过了两个春节。',
                    fx: { money: 6, perf: 5, hp: -6, net: -5 },
                },
                {
                    label: '拿着 offer 找老板谈加薪',
                    text: '老板沉默了一会儿，给你涨了两成。',
                    fx: { money: 4, perf: 2 },
                    risk: {
                        chance: 0.4,
                        text: '老板说：「年轻人不要太看重钱。」然后把你移出了一个项目群。',
                        fx: { net: -8 },
                    },
                },
                {
                    label: '婉拒',
                    text: '猎头说以后常联系。后来确实常联系。',
                    fx: { net: 3, heart: 2 },
                },
            ],
        },
        {
            id: 'j_intern', tier: 'junior', from: '隔壁工位',
            text: '新来的实习生把你做了一周的表删了一半，站在你工位旁边快哭了。',
            choices: [

        // ---------- 35 岁那年，固定出现 ----------
        {

            choices: [

            text: '35 岁生日那天，人力给你一份名单：你手下要走一个 35 岁以上的。和你同岁的老陈排在第一个。',
            choices: [
                {

                    text: '老陈走的那天，在你的工位上放了一盆绿萝。',
                    fx: { perf: 4, heart: -10 },
                },
                {
                    label: '换成绩效垫底的年轻人',
                    text: '年轻人走了。老陈不知道自己上过名单。',
                    fx: { heart: -4, net: -3 },
                },
                {
                    label: '去找老板把这个名额争掉',
                    text: '名额取消了。你用掉了攒了很多年的面子。',
                    fx: { heart: 10, net: -6 },
                    check: {
                        stat: 'net', min: 45,
                        fail: {
                            text: '名额没争掉。你的档案里多了一句：「管理者不够坚决」。',
                            fx: { perf: -8, heart: 5 },
                        },
                    },
                },
            ],
        },
    ];

    const clamp = (v) => Math.max(0, Math.min(100, v));
    const tierOf = (rank) => (rank <= 1 ? 'junior' : rank <= 3 ? 'mid' : rank <= 5 ? 'senior' : 'boss');
    const pick = (list, rng) => list[Math.floor(rng() * list.length)];

    const newGame = (originId, name, rng = Math.random) => {
        const origin = ORIGINS.find((o) => o.id === originId) || ORIGINS[1];
        const state = {
            rng,
            name: name || '打工人',
            origin,
            age: START_AGE,
            rank: 0,
            topRank: 0,
            yearsAtRank: 0,
            bossYears: 0,
            stats: { ...origin.stats },
            money: 0,
            used: new Set(),
            memory: {},
            log: [],
            notices: [],
            event: null,
            outcome: null,
            ending: null,
        };
        state.event = nextEvent(state);
        return state;
    };

    const nextEvent = (state) => {
        const { rng, used } = state;
        const fresh = (tier) => EVENTS.filter((e) => e.tier === tier && !used.has(e.id));
        const take = (ev) => {
            used.add(ev.id);
            return ev;
        };
        if (state.age === 35 && state.rank < 6 && !state.memory.crisis35) {
            state.memory.crisis35 = true;
            return take(EVENTS.find((e) => e.id === (state.rank <= 2 ? 'x_35_low' : 'x_35_high')));
        }
        const tier = tierOf(state.rank);
        let pool = fresh(tier);
        const anyPool = fresh('any');
        if (tier !== 'boss' && anyPool.length && (rng() < 0.2 || !pool.length)) {
            return take(pick(anyPool, rng));
        }
        if (!pool.length) {
            EVENTS.filter((e) => e.tier === tier).forEach((e) => used.delete(e.id));
            pool = fresh(tier);
        }
        // 早年的三件事和当高管后的三件事是一对，优先让它们出现
        const paired = pool.filter((e) => e.mirror || (e.recall && state.memory[e.recall]));
        if (paired.length && rng() < 0.6) {
            return take(pick(paired, rng));
        }
        return take(pick(pool, rng));
    };

    const recallLine = (state) => {
        const ev = state.event;
        const past = ev && ev.recall && state.memory[ev.recall];
        return past ? `你想起 ${past.age} 岁那年，你选的是「${past.label}」。` : '';
    };

    const choose = (state, index) => {
        const ev = state.event;
        const choice = ev.choices[index];
        let result = { text: choice.text, fx: choice.fx, ending: choice.ending };
        if (choice.check && state.stats[choice.check.stat] < choice.check.min) {
            result = choice.check.fail;
        } else if (choice.risk && state.rng() < choice.risk.chance) {
            result = choice.risk;
        }
        const deltas = [];
        Object.entries(result.fx || {}).forEach(([key, change]) => {
            if (!change) {
                return;
            }
            if (key === 'money') {
                state.money += change;
            } else {
                state.stats[key] = clamp(state.stats[key] + change);
            }
            deltas.push({ key, name: STAT_NAMES[key], change });
        });
        if (ev.mirror) {
            state.memory[ev.mirror] = { age: state.age, label: choice.label };
        }
        state.outcome = { label: choice.label, text: result.text, deltas, ending: result.ending };
        return state.outcome;
    };

    const finish = (state, endingId) => {
        const s = state.stats;
        const wealth = Math.max(0, Math.min(300, state.money)) / 30;
        const score = Math.round(state.topRank * 11 + s.hp * 0.12 + s.heart * 0.12 + wealth);
        state.ending = { id: endingId, ...ENDINGS[endingId], score: Math.min(100, score) };
        state.event = null;
        return state.ending;
    };

    // 过完这一年：结算、涨一岁、看能不能升职、看人生是否到此为止
    const advance = (state) => {
        const s = state.stats;
        const pending = state.outcome && state.outcome.ending;
        state.outcome = null;
        state.notices = [];
        if (pending) {
            return finish(state, pending);
        }
        if (s.hp <= 0) {
            return finish(state, 'icu');
        }
        if (s.heart <= 0) {
            return finish(state, 'exposed');
        }
        if (state.rank === 6) {
            state.bossYears += 1;
            if (state.bossYears >= BOSS_YEARS) {
                return finish(state, s.heart >= 60 ? 'boss_good' : s.heart < 30 ? 'boss_bad' : 'boss_mid');
            }
        }
        state.money += SAVINGS[state.rank];
        state.age += 1;
        state.yearsAtRank += 1;
        // 熬年头也算资历：不然乱选的玩家几乎见不到秘书，游戏后半段白做了
        s.perf = clamp(s.perf + 1);
        s.net = clamp(s.net + 1);
        if (state.age >= 30) {
            s.hp = clamp(s.hp - (state.age >= 38 ? 3 : 2));
            if (s.hp <= 0) {
                return finish(state, 'icu');
            }
        }
        const bar = PROMOTE[state.rank];
        if (bar && state.yearsAtRank >= MIN_YEARS_AT_RANK && s.perf >= bar.perf && s.net >= bar.net) {
            state.rank += 1;
            state.topRank = state.rank;
            state.yearsAtRank = 0;
            state.log.push(`${state.age} 岁，升任${RANKS[state.rank]}`);
            state.notices.push(`<b>晋升通知</b>　你升任${RANKS[state.rank]}了。`);
            if (state.rank === SECRETARY_RANK) {
                state.notices.push('<b>人事通知</b>　公司给你配了一位秘书：小周。');
            }
            if (state.rank === 6) {
                state.notices.push('顶楼的办公室是你的了。接下来三年，轮到你做决定。');
            }
        }
        if (state.age > LAST_AGE && state.rank < 6) {
            if (state.rank >= 4) {
                return finish(state, 'retire_exec');
            }
            if (state.rank >= 2) {
                return finish(state, 'retire_mid');
            }
            return finish(state, s.hp >= 60 ? 'fish' : 'retire_low');
        }
        state.event = nextEvent(state);
        return null;
    };

    return { RANKS, ORIGINS, ENDINGS, EVENTS, STAT_NAMES, PROMOTE, newGame, choose, advance, recallLine };
})();
</script>

<script>
(() => {
    const $ = (id) => document.getElementById(id);
    const esc = (text) => String(text).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
    const STORE_KEY = 'gongwei-to-dinglou.v1';

    const loadSave = () => {
        try {
            return { name: '', runs: 0, seen: [], ...JSON.parse(localStorage.getItem(STORE_KEY) || '{}') };
        } catch (err) {
            return { name: '', runs: 0, seen: [] };
        }
    };
    const writeSave = (save) => {
        try {
            localStorage.setItem(STORE_KEY, JSON.stringify(save));
        } catch (err) {
            // 无痕模式存不了，游戏照常玩，只是不记图鉴
        }
    };

    let save = loadSave();
    let originId = 'plain';
    let state = null;

    const show = (screen) => {
        ['start', 'play', 'end'].forEach((name) => {
            $(`screen-${name}`).hidden = name !== screen;
        });
        window.scrollTo(0, 0);
    };

    const renderStart = () => {
        $('name').value = save.name;
        $('origins').querySelectorAll('.origin').forEach((el) => el.remove());
        Game.ORIGINS.forEach((origin) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'origin';
            btn.setAttribute('aria-pressed', String(origin.id === originId));
            btn.innerHTML = `<b>${origin.name}</b><span>${origin.desc}</span>`;
            btn.addEventListener('click', () => {
                originId = origin.id;
                renderStart();
            });
            $('origins').appendChild(btn);
        });
        const ids = Object.keys(Game.ENDINGS);
        $('archive-head').textContent = `结局档案 ${save.seen.length} / ${ids.length}`;
        $('archive-list').innerHTML = ids
            .map((id) => (save.seen.includes(id)
                ? `<li class="seen">${Game.ENDINGS[id].title}</li>`
                : '<li>未解锁</li>'))
            .join('');
        show('start');
    };

    const renderHud = () => {
        $('hud-rank').innerHTML = `${esc(state.name)}　<span>${Game.RANKS[state.rank]}</span>`;
        $('hud-age').textContent = `${state.age} 岁　存款 ${state.money} 万`;
        $('hud-meters').innerHTML = ['perf', 'net', 'hp', 'heart']
            .map((key) => {
                const value = state.stats[key];
                const low = (key === 'hp' || key === 'heart') && value <= 25;
                return `<div class="meter${low ? ' low' : ''}">
                    <div class="meter-head"><span>${Game.STAT_NAMES[key]}</span><b>${value}</b></div>
                    <div class="bar"><i style="width:${value}%"></i></div>
                </div>`;
            })
            .join('');
    };

    const renderEvent = () => {
        renderHud();
        $('notices').innerHTML = state.notices.map((n) => `<p class="notice">${n}</p>`).join('');
        const ev = state.event;
        const recall = Game.recallLine(state);
        $('memo').innerHTML = `
            <div class="memo-from">来自：${ev.from}</div>
            <div class="memo-body">
                <p>${ev.text}</p>
                ${recall ? `<p class="recall">${recall}</p>` : ''}
            </div>
            <div class="choices">
                ${ev.choices.map((c, i) => `
                    <button class="choice" data-index="${i}">
                        <em>${'ABC'[i]}</em><span>${c.label}</span>
                    </button>`).join('')}
            </div>`;
        $('memo').querySelectorAll('.choice').forEach((btn) => {
            btn.addEventListener('click', () => renderOutcome(Number(btn.dataset.index)));
        });
        show('play');
    };

    const renderOutcome = (index) => {
        const outcome = Game.choose(state, index);
        renderHud();
        $('notices').innerHTML = '';
        const deltas = outcome.deltas
            .map((d) => {
                const sign = d.change > 0 ? '+' : '−';
                const unit = d.key === 'money' ? ' 万' : '';
                return `<span class="delta${d.change < 0 ? ' down' : ''}">${d.name} ${sign}${Math.abs(d.change)}${unit}</span>`;
            })
            .join('');
        $('memo').innerHTML = `
            <div class="memo-from">来自：${state.event.from}</div>
            <div class="memo-body">
                <p class="picked">你选了：${outcome.label}</p>
                <p>${outcome.text}</p>
                <div class="deltas">${deltas}</div>
            </div>
            <div class="next"><button class="primary" id="btn-next">${outcome.ending ? '看考核结果' : '过完这一年'}</button></div>`;
        $('btn-next').addEventListener('click', step);
        $('btn-next').focus({ preventScroll: true });
    };

    const step = () => {
        const ending = Game.advance(state);
        if (ending) {
            renderEnd();
        } else {
            renderEvent();
        }
    };

    const sealSvg = (text) => `
        <svg class="seal" viewBox="0 0 128 128" aria-hidden="true">
            <defs><path id="seal-arc" d="M 20 64 A 44 44 0 1 1 108 64"/></defs>
            <circle cx="64" cy="64" r="59" fill="none" stroke="#D32B26" stroke-width="4"/>
            <text font-size="13.5" font-weight="700" fill="#D32B26" letter-spacing="2.5"
                font-family="Songti SC, STSong, SimSun, serif">
                <textPath href="#seal-arc" startOffset="50%" text-anchor="middle">打工人生考核委员会</textPath>
            </text>
            <path fill="#D32B26" d="M64 40l5.6 17.3h18.2L73.1 68l5.6 17.3L64 74.6 49.3 85.3 54.9 68 40.2 57.3h18.2z"/>
            <text x="64" y="106" font-size="13" font-weight="700" fill="#D32B26" text-anchor="middle"
                letter-spacing="2" font-family="Songti SC, STSong, SimSun, serif">${text}</text>
        </svg>`;

    const renderEnd = () => {
        const end = state.ending;
        save.runs += 1;
        if (!save.seen.includes(end.id)) {
            save.seen.push(end.id);
        }
        writeSave(save);
        const name = esc(state.name);
        const years = state.age - 22;
        const career = state.log.length
            ? `<ol>${state.log.map((line) => `<li>${line}</li>`).join('')}</ol>`
            : '<p>在岗期间未获晋升。</p>';
        $('doc').innerHTML = `
            <p class="doc-org">打工人生考核委员会文件</p>
            <p class="doc-no">工考字〔${name}〕第 ${save.runs} 号</p>
            <hr class="doc-rule">
            <h1 class="doc-subject">关于${name}同志职业生涯的考核决定</h1>
            <p>${name}同志，${state.origin.name}，22 岁入职，在岗 ${years} 年。主要履历如下：</p>
            ${career}
            <p>经研究，认定该同志的职业生涯为：</p>
            <div class="verdict-title">${end.title}</div>
            <p class="verdict-line">${end.line}</p>
            <div class="sheet">
                <div><span class="k">最高职级</span><span class="v">${Game.RANKS[state.topRank]}</span></div>
                <div><span class="k">离岗年龄</span><span class="v">${state.age} 岁</span></div>
                <div><span class="k">存款</span><span class="v">${state.money} 万</span></div>
                <div><span class="k">健康</span><span class="v">${state.stats.hp}</span></div>
                <div><span class="k">良心</span><span class="v">${state.stats.heart}</span></div>
                <div><span class="k">人生评分</span><span class="v">${end.score}</span></div>
            </div>
            <div class="sign">
                ${sealSvg(end.seal)}
                <p>打工人生考核委员会</p>
                <p>${name} ${state.age} 岁那年</p>
            </div>
            <p class="doc-foot">从工位到顶楼　第 ${save.runs} 次人生</p>`;
        show('end');
    };

    const reportText = () => {
        const end = state.ending;
        return `【从工位到顶楼】${state.name}：${end.title}\n`
            + `${state.age} 岁离岗，最高做到${Game.RANKS[state.topRank]}，存款 ${state.money} 万，`
            + `人生评分 ${end.score}\n「${end.line}」`;
    };

    const copyReport = async () => {
        const text = reportText();
        const btn = $('btn-copy');
        try {
            await navigator.clipboard.writeText(text);
            btn.textContent = '已复制，去群里粘贴';
        } catch (err) {
            const area = document.createElement('textarea');
            area.value = text;
            document.body.appendChild(area);
            area.select();
            const ok = document.execCommand('copy');
            area.remove();
            btn.textContent = ok ? '已复制，去群里粘贴' : '复制失败，请直接截图';
        }
    };

    $('btn-start').addEventListener('click', () => {
        save.name = $('name').value.trim();
        writeSave(save);
        state = Game.newGame(originId, save.name);
        renderEvent();
    });
    $('btn-again').addEventListener('click', () => {
        $('btn-copy').textContent = '复制战报文字';
        renderStart();
    });
    $('btn-copy').addEventListener('click', copyReport);

    renderStart();

    // 调试用：网址后面加 ?auto=结局前停几步，自动乱选到结局，方便看结局页
    const auto = new URLSearchParams(location.search).get('auto');
    if (auto !== null) {
        state = Game.newGame(originId, save.name || '张三');
        let guard = 0;
        while (!state.ending && guard < 200) {
            Game.choose(state, Math.floor(Math.random() * state.event.choices.length));
            Game.advance(state);
            guard += 1;
            if (auto && guard === Number(auto)) {
                break;
            }
        }
        if (state.ending) {
            renderEnd();
        } else {
            renderEvent();
        }
    }
})();
</script>
</body>
</html>
